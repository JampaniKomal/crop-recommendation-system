name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned ML runtime
        run: |
          python -m pip install --upgrade pip
          # The subset needed to load the committed model and run the smoke test,
          # at the same pins as requirements.txt.
          pip install numpy==2.1.3 pandas==2.2.3 scikit-learn==1.9.1 ruff

      - name: Lint (syntax / undefined names)
        run: ruff check --select E9,F tests

      - name: Smoke test the committed model artefact
        run: python -W error::UserWarning tests/smoke_test.py
